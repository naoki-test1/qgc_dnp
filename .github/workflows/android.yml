name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'apk/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.8.3
      QT_MODULES: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors qtscxml
      ANDROID_ABI: arm64-v8a
      BUILD_TOOLS: 35.0.0
      GST_VERSION: 1.22.12
      APK_NAME: QGroundControl-sd-crawl.apk

    steps:
      # The default runner has ~14 GB free, which this build exceeds
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: df -h /

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-linux-android-arm64-scxml-v1

      # install-qt-action fails to resolve 6.8.3 ("No available Qt version found"), so call aqt directly
      - name: Install Qt (host + Android arm64)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install "aqtinstall==3.3.0"
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 -O "$RUNNER_TEMP/Qt" -m ${{ env.QT_MODULES }}
          aqt install-qt linux android ${{ env.QT_VERSION }} android_arm64_v8a -O "$RUNNER_TEMP/Qt" -m ${{ env.QT_MODULES }}

      - name: Set Qt paths
        run: |
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}/gcc_64" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}/android_arm64_v8a" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}"

      # Keeps CPM downloads (GStreamer for Android is ~1 GB) between runs
      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cpm-cache
          key: cpm-android-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-android-

      # GStreamer for Android is downloaded here instead of by CPM: CPM's download from
      # gstreamer.freedesktop.org fails with "HTTP/2 stream reset by server", and a failed
      # attempt leaves an empty source dir that later attempts reuse
      - name: Cache GStreamer for Android
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-android
          key: gstreamer-android-${{ env.GST_VERSION }}-arm64

      - name: Download GStreamer for Android
        if: steps.cache-gst.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          BASE="https://gstreamer.freedesktop.org/data/pkg/android/${GST_VERSION}"
          FILE="gstreamer-1.0-android-universal-${GST_VERSION}.tar.xz"
          curl -fL --http1.1 --retry 10 --retry-all-errors --retry-delay 10 -C - -o "$FILE" "$BASE/$FILE"
          curl -fL --http1.1 --retry 10 --retry-all-errors -o "$FILE.sha256sum" "$BASE/$FILE.sha256sum"
          echo "$(cut -d' ' -f1 "$FILE.sha256sum")  $FILE" | sha256sum -c -
          mkdir -p gstreamer-android
          tar -xJf "$FILE" -C gstreamer-android --wildcards '*arm64/*'
          rm -f "$FILE"
          # FindGStreamer.cmake expects <source>/arm64; flatten a top-level wrapper dir if present
          if [ ! -d gstreamer-android/arm64 ]; then
            mv "$(find gstreamer-android -maxdepth 3 -type d -name arm64 | head -1)" gstreamer-android/arm64
          fi
          ls gstreamer-android
          test -d gstreamer-android/arm64/lib

      # Retried in case another CPM download fails transiently
      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          for attempt in 1 2 3; do
            if ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_WARN_DEPRECATED=FALSE \
                -DCPM_SOURCE_CACHE="$RUNNER_TEMP/cpm-cache" \
                -DCPM_gstreamer_SOURCE="$RUNNER_TEMP/gstreamer-android" \
                -DQT_HOST_PATH="${{ env.QT_HOST_PATH }}" \
                -DQT_ANDROID_ABIS="${{ env.ANDROID_ABI }}" \
                -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
                -DANDROID_ABI="${{ env.ANDROID_ABI }}" \
                -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
                -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
                -DQT_ANDROID_SIGN_APK=OFF; then
              exit 0
            fi
            echo "::warning::Configure attempt $attempt failed, retrying in 30s"
            rm -rf _deps/*-subbuild
            sleep 30
          done
          exit 1

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --target all
          cmake --build . --target apk

      # Signs with the keystore in secrets when ANDROID_KEYSTORE_BASE64 is set,
      # otherwise with a throwaway key (uninstall the previous app before installing).
      - name: Sign APK
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          APK_IN=$(find . -name '*.apk' -path '*outputs/apk*' | head -1)
          [ -n "$APK_IN" ] || APK_IN=$(find . -name '*.apk' | head -1)
          echo "Unsigned APK: $APK_IN"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key"
            KEYSTORE_PASSWORD=android
            KEYSTORE_ALIAS=qgc
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEYSTORE_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=QGC sd-crawl CI"
          fi
          BT="$ANDROID_SDK_ROOT/build-tools/${{ env.BUILD_TOOLS }}"
          "$BT/zipalign" -f -p 4 "$APK_IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEYSTORE_ALIAS" \
            --out "${{ env.APK_NAME }}" aligned.apk
          "$BT/apksigner" verify --print-certs "${{ env.APK_NAME }}"
          rm -f release.keystore

      # Attached to a pre-release instead of an artifact: release assets do not count
      # against the Actions artifact storage quota
      - name: Publish APK to pre-release
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's#^apk/##; s#[^A-Za-z0-9._-]#-#g')
          TAG="apk-${BRANCH}-${GITHUB_SHA::9}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ env.APK_NAME }}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${{ env.APK_NAME }}" -R "$GITHUB_REPOSITORY" \
              --prerelease --target "$GITHUB_SHA" \
              --title "APK ${GITHUB_REF_NAME} (${GITHUB_SHA::9})" \
              --notes "Android arm64 APK built by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}."
          fi
          echo "APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
